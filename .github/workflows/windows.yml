name: Windows build and installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test tests/ReviveOS.Tests -c Release --logger "trx;LogFileName=tests.trx"
      - run: dotnet list ReviveOS.sln package --vulnerable --include-transitive
      - run: dotnet publish src/ReviveOS.UI -c Release -r win-x64 --self-contained true -o publish
      - name: Windows inventory and WPF smoke test
        shell: powershell
        run: ./scripts/windows-smoke.ps1
      - shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 missing on runner' }
          & $compiler installer/ReviveOS.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Get-FileHash artifacts/*.exe | Format-List | Out-File artifacts/SHA256.txt
      - name: Install, launch and uninstall smoke test
        shell: powershell
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ReviveOS-Windows-x64
          path: |
            artifacts/*
            tests/**/TestResults/*.trx

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReviveOS-Windows-x64
          path: release
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          notes="RELEASE-${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "ReviveOS Hybrid Extreme ${RELEASE_TAG}" --notes-file "$notes" release/artifacts/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "ReviveOS Hybrid Extreme ${RELEASE_TAG}" --generate-notes release/artifacts/*
          fi
